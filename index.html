        <h1 style="color: #10B981;">OptiGreen - Sustainable CI/CD Scheduler</h1>
        <p>OptiGreen is a carbon-aware CI/CD orchestration middleware and semantic contract solver orchestrated by Google Gemini 2.5 Flash and deployed on Google Cloud Run.</p>
        <h2>System Architecture & Features</h2>
        <ul>
          <li><strong>Autonomous Rerouting:</strong> Gemini 2.5 Flash autonomous tool loop routes compute to optimal green energy grids.</li>
          <li><strong>Egress Cost Solver:</strong> Pareto optimization balances network latency, WAN transfer egress cost, and carbon abatement.</li>
          <li><strong>Cryptographic Audit Ledger:</strong> SHA-256 block-linked ESG ledger for Scope 3 emissions accounting.</li>
        </ul>
        <h2>Live API Endpoints for Evaluators</h2>
        <ul>
          <li><code>GET /health</code> - Universal Service Health Check</li>
          <li><code>GET /api/carbon-intensity</code> - Live Regional Grid Intensity Data</li>
          <li><code>GET /api/queue</code> - Active Orchestration Queue</li>
          <li><code>GET /api/ledger</code> - Cryptographic Audit Ledger</li>
          <li><code>POST /api/queue/enqueue</code> - Carbon-Aware Workload Dispatch</li>
        </ul>
        <p><em>Enable JavaScript in your browser to access the full interactive real-time dashboard.</em></p>
