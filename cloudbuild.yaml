# ==============================================================================
# Google Cloud Build Pipeline for OptiGreen
# Managed via Google Cloud Console
# ==============================================================================

steps:
  # 1. Install dependencies and run Vitest suite
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npm run lint
        npm test

  # 2. Build Docker container image for Google Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/optigreen:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/optigreen:latest'
      - '.'

  # 3. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/optigreen:$COMMIT_SHA'

  # 4. Deploy to Google Cloud Run (Serverless container runtime in Google Cloud Console)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'optigreen-scheduler'
      - '--image=gcr.io/$PROJECT_ID/optigreen:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/optigreen:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/optigreen:latest'

options:
  logging: CLOUD_LOGGING_ONLY
